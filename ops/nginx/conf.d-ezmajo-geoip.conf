# /etc/nginx/conf.d/ezmajo-geoip.conf — visitor country for the shop's Argentina mode (pesos + Mercado Pago), passed to
# PHP as EZMAJO_COUNTRY in sites-available/ezmajo.com. Database: DB-IP Lite (free, CC BY 4.0), kept up to date by
# ezmajo-geoip.sh; it must exist before this file is installed, or nginx won't start.
geoip2 /var/lib/ezmajo-geoip/dbip-country-lite.mmdb {
    $ezmajo_country country iso_code;
}
