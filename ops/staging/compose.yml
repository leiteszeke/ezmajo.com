# Local staging copy of ezmajo.com: http://localhost:8080 (emails: http://localhost:8025)
# Usage: see ops/staging/README.md
name: ezmajo-staging

x-wp-env: &wp-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_NAME: ezmajo
  WORDPRESS_DB_USER: wp
  WORDPRESS_DB_PASSWORD: wp
  WORDPRESS_DEBUG: 1
  # Optional, from ops/staging/.env (gitignored): Gemini key for the editor's "Ayuda para escribir"
  EZMAJO_GEMINI_KEY: ${EZMAJO_GEMINI_KEY:-}
  WORDPRESS_CONFIG_EXTRA: |
    define( 'WP_ENVIRONMENT_TYPE', 'staging' );
    define( 'WP_HOME', 'http://localhost:8080' );
    define( 'WP_SITEURL', 'http://localhost:8080' );
    define( 'WP_DEBUG_LOG', true );
    define( 'WP_DEBUG_DISPLAY', false );
    define( 'WP_CACHE', false );

services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: ezmajo
      MARIADB_USER: wp
      MARIADB_PASSWORD: wp
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

  wp:
    image: wordpress:php8.1-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment: *wp-env
    volumes:
      - ../..:/var/www/html
      - ./staging-mail.php:/var/www/html/wp-content/mu-plugins/staging-mail.php:ro

  cli:
    image: wordpress:cli-php8.1
    profiles: ["cli"]
    user: "33:33"
    depends_on: [db]
    environment:
      <<: *wp-env
      HOME: /tmp
    volumes:
      - ../..:/var/www/html
      - ./staging-mail.php:/var/www/html/wp-content/mu-plugins/staging-mail.php:ro

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"

volumes:
  db:
